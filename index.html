<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SopaVentura" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="theme-color" content="#0d0a24" />
  <title>SopaVentura</title>
  <style>
    html, body { margin: 0; background: #0d0a24; }
    .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; color: #ece6ff;
      font: 18px/1.3 ui-monospace, 'Courier New', monospace; text-align: center; background: radial-gradient(circle at 60% 30%, #2a1a7c, #0d0a24 70%); }
    .boot-tiles { display: flex; gap: 6px; }
    .boot-tiles span { width: 34px; height: 34px; display: grid; place-items: center; background: #f4f0ff; color: #1d1450; font-weight: 800; font-size: 20px;
      box-shadow: 0 4px 0 #8b7fd0, 0 0 0 3px #07051a; animation: bt 1.2s steps(3) infinite; }
    .boot-tiles span:nth-child(2) { animation-delay: .1s } .boot-tiles span:nth-child(3) { animation-delay: .2s } .boot-tiles span:nth-child(4) { animation-delay: .3s }
    @keyframes bt { 50% { transform: translateY(-8px); } }
    .boot-tip { max-width: 320px; color: #c4b5fd; min-height: 3.9em; }
    @media (prefers-reduced-motion: reduce) { .boot-tiles span { animation: none; } }
  </style>
</head>
<body>
  <div id="app"><div class="boot" role="status" aria-live="polite">
    <div class="boot-tiles" aria-hidden="true"><span>S</span><span>O</span><span>P</span><span>A</span></div>
    <p class="boot-tip" id="boot-tip">Cargando…</p>
  </div></div>
  <script>
    (function () {
      var tips = ['Las palabras pueden ir al revés y en diagonal.', 'Si aciertas varias seguidas haces combo.', 'Toca a Olaf en el menú: tiene cosas que contar.',
        'Con un combo de 3 te llevas un potenciador.', 'En Logros está el álbum de pegatinas.', 'Puedes regalar una sopa con un mensaje escondido.',
        'De noche, las islas se ven de noche.', 'En «Jugar juntos» puedes retar a Olaf.', 'El dibujo de la semana da monedas extra.'];
      var el = document.getElementById('boot-tip'); if (el) el.textContent = tips[Math.floor(Math.random() * tips.length)];
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
