# Evita que Supabase pause el proyecto por inactividad (plan gratuito: pausa tras ~7 dias sin uso).
# Hace una peticion ligera cada 3 dias. Requiere dos "secrets" en GitHub (ver docs/SUPABASE.md):
#   SUPABASE_URL y SUPABASE_ANON_KEY  (la anon key es publica por diseño, pero se guarda como secret igualmente)
name: keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "Faltan secrets"; exit 1; }
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" "$URL/rest/v1/snapshots?select=role&limit=1" -H "apikey: $KEY"
